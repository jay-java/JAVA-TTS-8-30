version: '3.8'
services:
  seller-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: seller_db
    ports:
      - "3307:3306" # Mapped to 3307 to avoid conflict if local mysql is running, logic will need update or user needs to use this port. 
      # Actually, application.yml uses default 3306. I should map to 3306 if possible, or update application.yml.
      # Let's use 3306 and assume user doesn't have conflict, or user can change it.
      # Better: internal port 3306.
    ports:
      - "3306:3306"
    volumes:
      - seller_data:/var/lib/mysql

  product-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: product_db
    ports:
      - "3308:3306" # Product DB on 3308
    volumes:
      - product_data:/var/lib/mysql

volumes:
  seller_data:
  product_data:
